name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy_test:
    runs-on: [self-hosted, test]

    steps:
      - name: Update TEST
        shell: powershell
        working-directory: 'C:\Users\miks1\Documents\STUNDAS DARBS\TEST\stundas_darbs'
        run: |
          git fetch origin
          git switch prerelease
          git reset --hard origin/prerelease
          python hello_world.py

  deploy_main:
    runs-on: [self-hosted, prod]

    steps:
      - name: Update MAIN
        shell: powershell
        working-directory: 'C:\Users\miks1\Documents\STUNDAS DARBS\MAIN\stundas_darbs'
        run: |
          git fetch origin
          git switch main
          git reset --hard origin/main
          python hello_world.py