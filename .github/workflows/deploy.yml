name: Deploy Pipeline

on:
  push:
    branches:
      - prerelease
      - main

jobs:
  deploy_test:
    if: github.ref == 'refs/heads/prerelease'
    runs-on: [self-hosted, test]

    steps:
      - name: Update TEST
        shell: powershell
        working-directory: 'C:\Users\miks1\Documents\STUNDAS DARBS\TEST\stundas_darbs'
        run: |
          git switch prerelease
          git pull origin prerelease
          python hello_world.py

  deploy_main:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, prod]

    steps:
      - name: Update MAIN
        shell: powershell
        working-directory: 'C:\Users\miks1\Documents\STUNDAS DARBS\MAIN\stundas_darbs'
        run: |
          git switch main
          git pull origin main
          python hello_world.py