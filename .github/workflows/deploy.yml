name: Main to Prerelease Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-prerelease:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: powershell
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Merge main into prerelease
        shell: powershell
        run: |
          git fetch origin
          git switch -C prerelease origin/prerelease
          git merge origin/main --no-edit
          git push origin prerelease

      - name: Update TEST
        shell: powershell
        run: |
          cd "C:\Users\miks1\Documents\STUNDAS DARBS\TEST\stundas_darbs"

          git fetch origin
          git switch prerelease
          git reset --hard origin/prerelease

      - name: Run program
        shell: powershell
        run: |
          cd "C:\Users\miks1\Documents\STUNDAS DARBS\TEST\stundas_darbs"
          python hello_world.py